<style>
:root {
  --bg0: #080c12; --bg2: #161b22; --border: rgba(255,255,255,0.07); --border-hi: rgba(255,255,255,0.14);
  --text: #e6edf3; --muted: #8b949e; --accent: #3b82f6; --accent-hi: #60a5fa; --accent-glow: rgba(59,130,246,0.25);
  --error: #f87171; --radius: 12px; --ease: cubic-bezier(0.4, 0, 0.2, 1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: 'Sora', system-ui, sans-serif; color: var(--text); line-height: 1.6; min-height: 100dvh;
  display: flex; flex-direction: column; overflow-x: hidden;
  background:
    radial-gradient(ellipse 80% 50% at 50% 115%, rgba(59,130,246,0.18), transparent 70%),
    linear-gradient(180deg, #0b1220 0%, var(--bg0) 55%, #05080c 100%);
  background-attachment: fixed;
}
/* a quiet night sky, like solin.run */
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .55;
  background-image:
    radial-gradient(1px 1px at 12% 18%, #fff, transparent), radial-gradient(1px 1px at 27% 62%, #cfe0ff, transparent),
    radial-gradient(1.5px 1.5px at 41% 9%, #fff, transparent), radial-gradient(1px 1px at 58% 33%, #fff, transparent),
    radial-gradient(1px 1px at 69% 71%, #cfe0ff, transparent), radial-gradient(1.5px 1.5px at 83% 21%, #fff, transparent),
    radial-gradient(1px 1px at 91% 54%, #fff, transparent), radial-gradient(1px 1px at 6% 80%, #cfe0ff, transparent),
    radial-gradient(1px 1px at 35% 88%, #fff, transparent), radial-gradient(1px 1px at 76% 92%, #fff, transparent);
}
header, main, footer { position: relative; }
header { display: flex; padding: 20px 24px; }
.brand { display: inline-flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; border-radius: 8px; }
.brand:hover span { color: #fff; }
header img { width: 28px; height: 28px; border-radius: 7px; }
header span { font-weight: 600; letter-spacing: -0.01em; }
main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
       padding: 24px 16px 64px; text-align: center; }
.eyebrow { font-family: 'JetBrains Mono', monospace; font-size: .72rem; letter-spacing: .28em; text-transform: uppercase;
           color: var(--accent-hi); margin-bottom: 14px; }
h1 { font-size: clamp(2rem, 7vw, 3.25rem); font-weight: 600; letter-spacing: -0.03em; line-height: 1.1; }
.lead { color: var(--muted); margin: 14px auto 36px; max-width: 26rem; font-weight: 300; }
form { width: 100%; max-width: 25rem; display: flex; flex-direction: column; gap: 12px; }
input {
  width: 100%; font: 500 1.6rem/1 'JetBrains Mono', monospace; letter-spacing: .35em; text-align: center;
  text-transform: lowercase; color: var(--text); background: rgba(22,27,34,.75); backdrop-filter: blur(8px);
  border: 1px solid var(--border-hi); border-radius: var(--radius); padding: 20px 16px 20px calc(16px + .35em);
  transition: border-color 150ms var(--ease), box-shadow 150ms var(--ease); outline: none;
}
input::placeholder { color: #3d4652; }
input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-glow); }
input[aria-invalid="true"] { border-color: var(--error); }
button {
  font: 600 1rem 'Sora', system-ui, sans-serif; color: #0b1220; background: #f3f6fa; border: 0; cursor: pointer;
  border-radius: 999px; padding: 15px 22px; display: inline-flex; justify-content: center; align-items: center; gap: 10px;
  transition: transform 150ms var(--ease), background 150ms var(--ease), box-shadow 150ms var(--ease);
  box-shadow: 0 8px 30px rgba(59,130,246,.18);
}
button:hover { background: #fff; transform: translateY(-1px); }
button:active { transform: none; }
button:disabled { opacity: .6; cursor: progress; }
button svg { width: 18px; height: 18px; }
.message { min-height: 1.5em; font-size: .9rem; color: var(--error); }
.message.notice { color: #fbbf24; }
.waiting { display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 26rem; }
[hidden] { display: none !important; }
.waiting .muted { color: var(--muted); font-weight: 300; font-size: .9rem; }
.countdown { font: 500 1.15rem 'JetBrains Mono', monospace; color: var(--accent-hi); }
.pulse { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 var(--accent-glow);
         animation: pulse 2s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 18px rgba(59,130,246,0); } 100% { box-shadow: 0 0 0 0 rgba(59,130,246,0); } }
.hint { margin-top: 28px; color: var(--muted); font-size: .85rem; max-width: 24rem; font-weight: 300; }
footer { padding: 20px; text-align: center; font-size: .8rem; color: #4d5561; }
footer a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--border-hi); }
footer a:hover { color: var(--text); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

<main>
  <p class="eyebrow" data-t="eyebrow">Solin Meetings</p>
  <h1 data-t="title">Join a meeting</h1>
  <p class="lead" data-t="lead">Enter the meeting code you received from your congregation.</p>
  <form id="join" action="/go" method="get" novalidate>
    <input id="code" aria-label="Meeting code" name="code" value="{{CODE}}" placeholder="abc234" autocomplete="off" autocapitalize="none"
             autocorrect="off" spellcheck="false" maxlength="12" inputmode="text" aria-describedby="message" autofocus>
    <p id="message" class="message" role="alert"></p>
    <button type="submit">
      <span data-t="join">Join</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </form>
  <div id="waiting" class="waiting" hidden>
    <div class="pulse" aria-hidden="true"></div>
    <p id="countdown" class="countdown"></p>
    <p class="muted" data-t="waitingHint">Keep this page open: it opens the meeting by itself as soon as it starts.</p>
  </div>
  <p class="hint" data-t="hint">The code has 6 letters and numbers, as in meet.solin.run/abc234.</p>
</main>
<footer><a href="https://solin.run/" data-t="about">About Solin</a></footer>
<script>
'use strict';
(() => {
  const ALPHABET = /^[23456789bcdfghjkmnpqrstvwxyz]{6}$/;
  const TEXT = {
    en: { eyebrow: 'Solin Meetings', title: 'Join a meeting', lead: 'Enter the meeting code you received from your congregation.',
          codeLabel: 'Meeting code', join: 'Join', hint: 'The code has 6 letters and numbers, as in meet.solin.run/abc234.',
          about: 'About Solin', empty: 'Type the meeting code.', invalid: 'That is not a meeting code. Check it and try again.',
          notfound: 'There is no meeting with code {code}. Check the code and try again.',
          toomany: 'Too many codes tried from this connection. Wait 15 minutes and try again.',
          retired: 'The link with code {code} is no longer valid. Ask your congregation for the new one.',
          waitingTitle: 'The meeting has not opened yet', waitingLead: 'Meeting {code}',
          kinds: { midweek: 'Midweek meeting', weekend: 'Weekend meeting', extra: 'Meeting', unscheduled: 'Meeting' },
          waitingHint: 'Keep this page open: it opens the meeting by itself as soon as it starts.',
          startsIn: 'Starts in {time}', startsAt: 'Starts {time}', soon: 'Starting soon' },
    pt: { eyebrow: 'Reuniões Solin', title: 'Entrar numa reunião', lead: 'Digite o código da reunião que você recebeu da sua congregação.',
          codeLabel: 'Código da reunião', join: 'Entrar', hint: 'O código tem 6 letras e números, como em meet.solin.run/abc234.',
          about: 'Sobre o Solin', empty: 'Digite o código da reunião.', invalid: 'Esse não é um código de reunião. Confira e tente de novo.',
          notfound: 'Não existe reunião com o código {code}. Confira o código e tente de novo.',
          toomany: 'Muitos códigos tentados a partir desta conexão. Aguarde 15 minutos e tente de novo.',
          retired: 'O link com o código {code} não é mais válido. Peça o novo à sua congregação.',
          waitingTitle: 'A reunião ainda não foi aberta', waitingLead: 'Reunião {code}',
          kinds: { midweek: 'Reunião do meio de semana', weekend: 'Reunião do fim de semana', extra: 'Reunião', unscheduled: 'Reunião' },
          waitingHint: 'Deixe esta página aberta: ela entra na reunião sozinha assim que começar.',
          startsIn: 'Começa em {time}', startsAt: 'Começa {time}', soon: 'Começa em instantes' },
    es: { eyebrow: 'Reuniones Solin', title: 'Entrar a una reunión', lead: 'Escriba el código de la reunión que recibió de su congregación.',
          codeLabel: 'Código de la reunión', join: 'Entrar', hint: 'El código tiene 6 letras y números, como en meet.solin.run/abc234.',
          about: 'Acerca de Solin', empty: 'Escriba el código de la reunión.', invalid: 'Ese no es un código de reunión. Revíselo e inténtelo de nuevo.',
          notfound: 'No existe ninguna reunión con el código {code}. Revise el código e inténtelo de nuevo.',
          toomany: 'Demasiados códigos probados desde esta conexión. Espere 15 minutos e inténtelo de nuevo.',
          retired: 'El enlace con el código {code} ya no es válido. Pida el nuevo a su congregación.',
          waitingTitle: 'La reunión aún no se ha abierto', waitingLead: 'Reunión {code}',
          kinds: { midweek: 'Reunión de entre semana', weekend: 'Reunión del fin de semana', extra: 'Reunión', unscheduled: 'Reunión' },
          waitingHint: 'Deje esta página abierta: entra en la reunión sola en cuanto empiece.',
          startsIn: 'Empieza en {time}', startsAt: 'Empieza {time}', soon: 'Empieza en breve' },
  };
  const lang = (navigator.languages || [navigator.language || 'en']).map(l => l.slice(0, 2).toLowerCase()).find(l => TEXT[l]) || 'en';
  const T = TEXT[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = T[el.dataset.t]; });
  document.title = T.eyebrow;
  document.getElementById('code').setAttribute('aria-label', T.codeLabel);

  const form = document.getElementById('join');
  const input = document.getElementById('code');
  const message = document.getElementById('message');
  const normalize = s => s.toLowerCase().replace(/^.*\//, '').replace(/[\s-]/g, '');
  const show = (key, code) => {
    message.textContent = key ? T[key].replace('{code}', code || '') : '';
    const notice = key === 'notfound' || key === 'retired' || key === 'toomany';
    message.className = notice ? 'message notice' : 'message';
    input.setAttribute('aria-invalid', key && !notice ? 'true' : 'false');
  };
  const { message: state, code: givenCode, starts, title, kind } = document.body.dataset;
  if (state === 'waiting') {
    // A meeting its Solin has not opened yet: name it, count down, and reload until it opens.
    const kindName = T.kinds[kind] || '';
    document.querySelector('.eyebrow').textContent = kindName || T.eyebrow;
    document.querySelector('h1').textContent = title || T.waitingTitle;
    document.querySelector('.lead').textContent = title ? T.waitingTitle : T.waitingLead.replace('{code}', givenCode);
    if (title) document.title = title;
    form.hidden = true;
    document.querySelector('.hint').hidden = true;
    document.getElementById('waiting').hidden = false;
    const countdown = document.getElementById('countdown');
    const startsAt = starts ? new Date(starts) : null;
    const tick = () => {
      if (!startsAt || isNaN(startsAt)) { countdown.textContent = ''; return; }
      const minutes = Math.ceil((startsAt - Date.now()) / 60000);
      if (minutes <= 0) countdown.textContent = T.soon;
      else if (minutes <= 60) countdown.textContent = T.startsIn.replace('{time}', minutes + ' min');
      else countdown.textContent = T.startsAt.replace('{time}', startsAt.toLocaleString(lang,
        { weekday: 'long', hour: '2-digit', minute: '2-digit' }));
    };
    tick();
    setInterval(tick, 15000);
    setInterval(() => location.reload(), 15000);
  } else {
    show(state, givenCode);
  }

  input.addEventListener('input', () => show(''));
  form.addEventListener('submit', e => {
    e.preventDefault();
    const code = normalize(input.value);
    if (!code) return show('empty');
    if (!ALPHABET.test(code)) return show('invalid');
    form.querySelector('button').disabled = true;
    location.assign('/' + code);
  });
})();
</script>
</body>
</html>
