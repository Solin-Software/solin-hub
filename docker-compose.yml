# Solin meeting hub: Caddy (HTTPS, https://HUB_DOMAIN/<code>) -> frps (reverse tunnels from the
# Solin running each meeting) + coturn (TURN relay) + ask (meeting codes, routing, frps plugin,
# landing page).
#
#   cp hub.env.example hub.env   # then edit it
#   docker compose up -d
#
# Every service uses host networking: coturn needs a large UDP port range, and the internal
# services (ask, frps admin API, per-meeting tunnel ports) bind to 127.0.0.1 only.
# The local development variant: see local/hub.env.local and README.md.

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  caddy:
    image: caddy:2.11.7-alpine
    network_mode: host
    restart: unless-stopped
    env_file: ${HUB_ENV_FILE:-hub.env}
    depends_on: [ask]
    volumes:
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - ./sites.caddy:/etc/caddy/sites.caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

  frps:
    image: fatedier/frps:v0.71.1
    network_mode: host
    restart: unless-stopped
    env_file: ${HUB_ENV_FILE:-hub.env}
    depends_on: [ask]
    command: ["-c", "/etc/frp/frps.toml"]
    volumes:
      - ./frps.toml:/etc/frp/frps.toml:ro
      # tunnel.crt + tunnel.key (scripts/tunnel_cert.sh); kept on the VPS, never in the repository.
      - ${TUNNEL_TLS_DIR:-./tls}:/etc/frp/tls:ro
    logging: *logging

  ask:
    build: ./ask
    image: solin-hub-ask:1
    network_mode: host
    restart: unless-stopped
    env_file: ${HUB_ENV_FILE:-hub.env}
    volumes:
      # The meeting-code registry (codes.json), kept across deploys.
      - ask-data:/data
    logging: *logging

  coturn:
    image: coturn/coturn:4.18.0
    network_mode: host
    restart: unless-stopped
    env_file: ${HUB_ENV_FILE:-hub.env}
    entrypoint: ["/bin/sh", "/etc/coturn/entrypoint.sh"]
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf.template:ro
      - ./coturn-entrypoint.sh:/etc/coturn/entrypoint.sh:ro
    logging: *logging

volumes:
  ask-data:
  caddy-data:
  caddy-config:
